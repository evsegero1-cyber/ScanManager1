name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    name: Тесты правил Firestore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v1
      - run: npm ci
      - run: npm test

  android:
    name: Сборка APK и юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Юнит-тесты
        run: gradle :app:testReleaseUnitTest --stacktrace
      - name: Сборка release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Lint
        run: gradle :app:lintRelease
      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk ScanManager-v2.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScanManager-apk
          path: ScanManager-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Релиз (удобно скачать с телефона)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: ScanManager 2.0.${{ github.run_number }}
          files: ScanManager-*.apk

  emulator:
    name: Запуск на эмуляторе (UI-тесты + release APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Собрать APK для тестов
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Эмулятор
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.example.warehouseapp.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "FAILURES!!!" instrument.txt && exit 1 || true
            grep -q "OK (" instrument.txt || exit 1
            adb uninstall com.example.warehouseapp
            adb install -g app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.example.warehouseapp/.MainActivity
            sleep 15
            adb shell screencap -p /sdcard/release.png && adb pull /sdcard/release.png release.png
            adb logcat -d > logcat.txt
            grep -E "FATAL EXCEPTION|AndroidRuntime: Process: com.example.warehouseapp" logcat.txt && exit 1 || true
            adb shell pidof com.example.warehouseapp || exit 1
            echo "release APK запущен без падений"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: |
            instrument.txt
            logcat.txt
            release.png
