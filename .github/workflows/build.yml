name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    name: Тесты правил Firestore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-v1
      - run: npm ci
      - run: npm test

  android:
    name: Сборка APK и юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Юнит-тесты
        run: gradle :app:testReleaseUnitTest --stacktrace
      - name: Сборка release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Lint
        run: gradle :app:lintRelease
      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk ScanManager-v2.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScanManager-apk
          path: ScanManager-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Релиз (удобно скачать с телефона)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: ScanManager 2.0.${{ github.run_number }}
          files: ScanManager-*.apk
